version: '3.8'

services:
  web:
    build: .
    ports:
      - "18000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MAP_PROVIDER=${MAP_PROVIDER:-amap}
      - AMAP_API_KEY=${AMAP_API_KEY}
      - AMAP_SECURITY_KEY=${AMAP_SECURITY_KEY}
      - BAIDU_MAP_API_KEY=${BAIDU_MAP_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
